# THE declarative source for model/provider routing facts.
#
# Phase 6 (docs/decision-phase6-model-router-registry-20261016.md): one source
# generates the bus routing tables in hive/core/models.py AND the per-host
# zoder/zeroclaw TOML fragments. Consumers are GENERATED — never hand-edited.
#
# This cut is BEHAVIOR-PRESERVING: every value below re-states today's values
# exactly. Regenerating must be a no-op (see test_model_registry.py).

schema_version = 1


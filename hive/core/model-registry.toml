# ── per-MTok rates (USD input/output) + per-model routing facts ─────────────
# `routes` names the consumers allowed to select the model:
#   "knemon"          -> KNEMON_PROVIDERS (the bus's cost-aware router)
#   "zoder.coder" / "zoder.reviewer" / "zoder.reviewer.backup"
#   "zeroclaw.default"
# `knemon_alias`/`knemon_tier` only apply when "knemon" is in routes.
# `emit_rate = false` keeps a model OUT of the bus LLM_RATES table (host-placement
# models are priced by their host, not by the bus router).
# Model key "<provider>/<model>" except the provider wildcard "*".


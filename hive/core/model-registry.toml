# ── per-host engine placement ───────────────────────────────────────────────
# Facts only; the generator turns these into TOML fragments.
#
# Nemotron (fleet rule): nvidia/nemotron-3-ultra-550b-a55b is the ONLY Nemotron,
# EIH-only, backup reviewer. It must never carry a "knemon" route.

[[model]]
key = "local/qwen38"
emit_rate = false
in = 0.0
out = 0.0
endpoint = "http://tydeus:8006/v1"
routes = ["zoder.coder"]
[[model]]
key = "local/gemma4-31b"
emit_rate = false
in = 0.0
out = 0.0
endpoint = "http://cerberus:8080/v1"
routes = ["zoder.reviewer"]
[[model]]
key = "nvidia/nemotron-3-ultra-550b-a55b"
emit_rate = false
in = 0.0
out = 0.0
endpoint = "https://integrate.api.nvidia.com/v1"
routes = ["zoder.reviewer.backup"]
notes = "EIH-only backup reviewer (NVIDIA EIH, integrate.api.nvidia.com). Fleet rule: never a knemon/coder candidate."

[host.cerberus]
